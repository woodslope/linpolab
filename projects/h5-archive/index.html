  <style>
    :root{--paper:#f4f4f1;--ink:#050505;--text:#1b1b1d;--muted:#6d6f73;--line:rgba(0,0,0,.13);--focus:#4078ff;--radius:7px}
    *{box-sizing:border-box}html{background:var(--paper);color:var(--text);font-family:Inter,"Noto Sans SC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0}a{color:inherit}
    main{width:min(1440px,calc(100% - clamp(32px,5vw,80px)));height:100vh;height:100dvh;margin:0 auto;padding:clamp(20px,3.5vh,36px) 0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(16px,2.8vh,28px);overflow:hidden;animation:archive-in .35s ease both}
    header{display:block;padding-bottom:clamp(12px,1.8vh,18px);border-bottom:1px solid var(--line)}
    .utility{min-height:20px;margin-bottom:clamp(8px,1.2vh,12px);display:flex;align-items:center;gap:7px;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:10px;line-height:1;color:var(--muted)}.utility a{text-decoration:none}.utility a:hover{color:var(--ink)}.utility .brand{color:var(--ink);font-weight:700}.utility .home{margin-left:auto;padding:5px 0}

    header p{max-width:560px;margin:7px 0 0;color:var(--muted);font-size:clamp(12px,1vw,14px);line-height:1.45;text-align:left}
    .cases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);min-height:0}
    .case{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;text-decoration:none;border:1px solid var(--line);border-radius:var(--radius);background:#fafaf8;overflow:hidden;transition:border-color 260ms ease,box-shadow 320ms ease,transform 320ms cubic-bezier(.16,1,.3,1)}
    .visual{position:relative;min-height:0;overflow:hidden;background:#101312}.visual img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 24%;filter:saturate(.9);transition:transform .28s ease,filter .28s ease}.visual::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.12);pointer-events:none}
    .meta{height:34px;min-height:0;padding:5px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid rgba(0,0,0,.1);background:#fafaf8}.meta h2{min-width:0;margin:0;color:var(--text);font-size:clamp(12px,1vw,14px);font-weight:600;line-height:1.2;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.index{flex:0 0 auto;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:9px;line-height:1;color:#85878b}
    .case:hover{transform:translateY(-3px);border-color:rgba(0,0,0,.34);box-shadow:0 12px 28px rgba(0,0,0,.09)}.case:hover img{transform:scale(1.018);filter:saturate(1)}.case:active{transform:translateY(-1px) scale(.998)}.case:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
    @keyframes archive-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media(max-width:1050px){main{width:min(100% - 32px,900px);height:auto;min-height:100vh;min-height:100dvh;overflow:visible}.cases{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none}.case{aspect-ratio:3/4}.case:last-child:nth-child(4n+2){grid-column:auto}}
    @media(max-width:700px){main{width:min(100% - 24px,560px);padding:18px 0 28px;gap:16px}.utility{margin-bottom:9px}header{padding-bottom:12px}h1{font-size:clamp(21px,7vw,28px);white-space:normal}header p{max-width:none;margin-top:6px;font-size:11px}.cases{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.case{aspect-ratio:3/4}.meta{height:36px;padding:5px 8px}.meta h2{font-size:12px}.index{font-size:9px}}
    @media(max-height:700px) and (min-width:1051px){main{padding:16px 0;gap:12px}header{padding-bottom:12px}.meta{height:32px;padding:4px 9px}.meta h2{font-size:12px}}
    @media(prefers-reduced-motion:reduce){main{animation:none}.case,.visual img{transition:none}}
  </style>
