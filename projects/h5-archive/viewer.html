<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>H5 浏览</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f4f1}
    .viewer-nav{position:fixed;z-index:10;top:max(16px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;pointer-events:none}.viewer-nav a{min-height:34px;display:inline-flex;align-items:center;color:rgba(255,255,255,.72);font-size:11px;line-height:1;text-decoration:none;pointer-events:auto;transition:color .18s ease}.viewer-nav a:hover{color:#fff}.viewer-brand{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:700}.viewer-back{gap:6px}
    .canvas{width:100%;height:100%;height:100dvh;display:grid;place-items:center}.phone{position:relative;width:370px;height:568px;background:#fff;overflow:hidden;border-radius:8px;outline:2px solid rgba(255,255,255,.72);outline-offset:0;box-shadow:0 18px 60px rgba(0,0,0,.45);transform:scale(var(--player-scale,1))}iframe{display:block;width:370px;height:568px;border:0;background:#fff}.error{display:none;position:absolute;inset:0;margin:0;padding:24px;place-items:center;text-align:center;color:#666;line-height:1.8;background:#fff}
    @media(max-width:700px){.viewer-nav{top:max(8px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right))}.phone{border-radius:8px;box-shadow:none}}
    @media(prefers-reduced-motion:reduce){.viewer-nav a{transition:none}}
  </style>
</head>
<body>
  <nav class="viewer-nav" aria-label="H5 浏览导航"><a class="viewer-brand" href="../../index.html">LINPO LAB</a><a class="viewer-back" href="index.html"><span aria-hidden="true">←</span>案例总览</a></nav>
  <main class="canvas"><div class="phone"><iframe id="frame" title="H5 案例" allow="autoplay; fullscreen; gyroscope; accelerometer"></iframe><p class="error" id="error" role="status">这个案例暂时无法加载。</p></div></main>
  <script>
    const cases={
      recruitment:{title:'招兵买马',src:'cases/recruitment/index.html?v=8'},
      shuanglong:{title:'双珑原著',src:'cases/shuanglong/index.html?v=8'},
      meihaojia:{title:'万科 · 美好家',src:'cases/meihaojia/index.html?v=8'},
      yanlan:{title:'滟澜新宸',src:'cases/yanlan/index.html?v=8'},
      xichen:{title:'西宸原著',src:'cases/xichen/index.html?v=8'},
      uber:{title:'优步合作司机专属购房福利',src:'cases/uber/index.html?v=8'},
      sanhao:{title:'2015 杭州万科三好',src:'cases/sanhao/index.html?v=8'},
      changcheng:{title:'长城源著',src:'cases/changcheng/index.html?v=8'},
      love:{title:'爱在此刻',src:'cases/love/index.html?v=8'},
      chufu:{title:'初伏遇出福',src:'cases/chufu/index.html?v=8'}
    };
    const frame=document.querySelector('#frame');
    const error=document.querySelector('#error');
    const phone=document.querySelector('.phone');
    const caseKey=new URLSearchParams(location.search).get('case');
    const pageBackgrounds={
      sanhao:{
        page_13853534097181:'#fff',page_6e736b18f7331b5a7a84766c147bb941:'#fff',page_c92394164dd2f16ded7b6663b3fb83ac:'#fff',
        page_134fe57e4424bbcb0e1ada3b1bc1cb12:'#fff',page_446c253c7a9b1ad8:'#fff',page_95c5e311541125b0b2372ea853aa17ab:'#fff',
        page_f55a162e5f448d52:'#fff',page_27eed5aa9c14594f87c51ecaa0dc6e1b:'#fff',page_c7a313fa7eccb26ec737469c7fbea54d:'#fff'
      }
    };
    const fitPlayer=()=>{
      const scale=matchMedia('(max-width:700px)').matches?Math.min(innerWidth/370,(innerHeight-52)/568):1;
      phone.style.setProperty('--player-scale',scale);
    };
    const adaptFrame=()=>{
      try{
        const doc=frame.contentDocument;
        if(!doc?.head||!doc.querySelector('.slides-wrap .interaction-view'))return false;
        let style=doc.querySelector('#archive-canvas-overrides');
        if(!style){style=doc.createElement('style');style.id='archive-canvas-overrides';doc.head.appendChild(style)}
        style.textContent='html,body{width:370px!important;height:568px!important;overflow:hidden!important}body>button{display:none!important}.reveal,.slides-wrap,.slides,.Presentation{width:320px!important;height:480px!important;overflow:visible!important}.Presentation:before{content:"";position:absolute;left:-25px;top:-44px;width:370px;height:568px;background:var(--archive-page-background,#fff);pointer-events:none;z-index:0}.Presentation>.interaction-area{z-index:1}.interaction-view{overflow:visible!important}.action-control{left:50%!important;margin-left:0!important;transform:translateX(-50%)!important;background:rgba(255,255,255,.82)!important;border-radius:4px!important;box-shadow:0 1px 4px rgba(0,0,0,.16)!important;overflow:hidden!important}.action-control .btn{display:inline-flex!important;width:40px!important;height:34px!important;padding:0!important;align-items:center!important;justify-content:center!important;vertical-align:top!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important}.action-control .btn+.btn{border-left:1px solid rgba(0,0,0,.08)!important}.action-control .btn i{display:block!important;width:16px!important;height:16px!important;margin:0!important;background:currentColor!important;border:0!important;line-height:0!important;transform:none!important}.action-control .btn i:before{content:none!important}.navigate-left i{clip-path:polygon(70% 0,20% 50%,70% 100%,88% 82%,56% 50%,88% 18%)!important}.navigate-right i{clip-path:polygon(30% 0,80% 50%,30% 100%,12% 82%,44% 50%,12% 18%)!important}.navigate-up i{clip-path:polygon(0 70%,50% 20%,100% 70%,82% 88%,50% 56%,18% 88%)!important}.navigate-down i{clip-path:polygon(0 30%,50% 80%,100% 30%,82% 12%,50% 44%,18% 12%)!important}';
        const loading=doc.querySelector('#jswait-loading');
        const loadingColor=frame.contentWindow.server?.epub360_logo?.loading_bg_color;
        if(loading)loading.style.setProperty('background-color',loadingColor||'#fff','important');
        doc.querySelectorAll('.Presentation').forEach(page=>{
          const color=getComputedStyle(page).backgroundColor;
          const channels=color.match(/[\d.]+/g)||[];
          const alpha=channels.length===4?Number(channels[3]):1;
          const override=pageBackgrounds[caseKey]?.[page.id];
          page.style.setProperty('--archive-page-background',override||(alpha===0?'transparent':color));
        });
        return true;
      }catch{return false}
    };
    let adaptAttempts=0;
    const adaptTimer=setInterval(()=>{
      if(adaptFrame()||++adaptAttempts>=40)clearInterval(adaptTimer);
    },250);
    const showError=()=>{frame.hidden=true;error.style.display='grid'};
    const item=cases[caseKey];
    fitPlayer();
    addEventListener('resize',fitPlayer);
    if(item){document.title=`${item.title} · H5 浏览`;frame.title=item.title;frame.addEventListener('error',showError);frame.addEventListener('load',adaptFrame);frame.src=item.src}else{clearInterval(adaptTimer);showError()}
  </script>
</body>
</html>
